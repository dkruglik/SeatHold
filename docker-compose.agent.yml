# Throwaway PostgreSQL for one Agent Manager run (scripts/agent-db.mjs).
# Own compose project, a free localhost port, data in memory. The image matches docker-compose.yml.
services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set by scripts/agent-db.mjs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set by scripts/agent-db.mjs}
      POSTGRES_DB: ${POSTGRES_DB:?set by scripts/agent-db.mjs}
    ports:
      - "127.0.0.1:${AGENT_DB_PORT:?set by scripts/agent-db.mjs}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
