# Local development stack. Same PostgreSQL major version as production (17).
# Values are local-only placeholders; real credentials never go in this file.
services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seatholder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatholder}
      POSTGRES_DB: ${POSTGRES_DB:-seatholder}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local mail catcher: the app sends SMTP to 1025, the inbox is at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
